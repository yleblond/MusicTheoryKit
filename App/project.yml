name: JamShackApp
options:
  bundleIdPrefix: com.jamshack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MusicTheoryKit:
    path: ..

targets:
  JamShackApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: JamShack
        NSMicrophoneUsageDescription: >-
          JamShack ecoute le microphone pour reconnaitre les accords et modes joues.
        NSLocalNetworkUsageDescription: >-
          JamShack utilise le reseau local pour la console web, le clavier virtuel et la
          session collaborative.
        NSBonjourServices:
          - _musicimprov._tcp
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Generated/JamShackApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        # Pairs with .fileExporter/.fileImporter (scene save/load, sample-sound folder in
        # SceneManagementView): grants read/write access to whatever the user actually
        # picked via the panel these present — macOS-only concept (no effect on iOS, which
        # has no equivalent entitlement key), but harmless to declare on both since XcodeGen
        # applies the same entitlements dict to the single multiplatform target.
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: MusicTheoryKit
        product: JamShackUI
      - package: MusicTheoryKit
        product: AppCore
      - package: MusicTheoryKit
        product: Localization
