name: JamShackApp
options:
  bundleIdPrefix: com.jamshack
  deploymentTarget:
    # Bumped from 17.0/14.0 to adopt the `Tab(_:systemImage:)` + `.tabViewStyle(.sidebarAdaptable)`
    # API pair (see ContentView.swift) — on macOS specifically, the classic `.tabItem { Label }`
    # top tab bar never shows icons (confirmed empirically: neither `.tabItem`+`Label` NOR the
    # new `Tab()` API show an icon in that style on this OS — only `.sidebarAdaptable` does).
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
  createIntermediateGroups: true

packages:
  MusicTheoryKit:
    path: ..

targets:
  JamShackApp:
    type: application
    platform: [iOS, macOS, visionOS]
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: JamShack
        # Macro substitution (not a literal number) so Xcode resolves it per-build-config —
        # XcodeGen's own default bakes a hardcoded "1.0"/"1" here instead if these two keys
        # are left unset, ignoring MARKETING_VERSION/CURRENT_PROJECT_VERSION above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Answers App Store Connect's export-compliance question ("Missing Compliance") ahead
        # of time — this app only uses HTTPS/standard OS encryption (no custom/proprietary
        # crypto), which is exempt, so `false` here skips that prompt on every archive upload
        # instead of having to answer "no encryption" by hand each time.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          JamShack ecoute le microphone pour reconnaitre les accords et modes joues.
        NSLocalNetworkUsageDescription: >-
          JamShack utilise le reseau local pour la console web, le clavier virtuel et la
          session collaborative.
        NSBonjourServices:
          - _musicimprov._tcp
        # App Store category — previously patched by hand straight into the generated
        # Info.plist (never tracked here), so a `xcodegen generate` would silently drop it.
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        # `true` since the detachable auxiliary windows (`AppModel`/`JamShackApp`) need it on
        # visionOS — like iOS, visionOS is UIScene-based and actually enforces this key (unlike
        # AppKit/macOS, which ignores it), so `false` here silently made every `openWindow(id:)`
        # call a no-op there. Harmless on iOS (nothing there ever calls `openWindow` — that UI
        # is `#if os(macOS) || os(visionOS)`-gated) and on macOS (AppKit doesn't consult this
        # key regardless).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Lets CloudKit wake this app via silent push when another device changes something in
        # the shared container, instead of only syncing on a schedule/next foreground — see
        # `RemoteNotificationDelegate.swift` and `ImprovSession.startObservingRemoteStoreChanges`.
        # iOS-only concept (harmless to declare on the shared multiplatform target, same
        # tolerance as `com.apple.security.files.user-selected.read-write` below).
        UIBackgroundModes:
          - remote-notification
        # Makes the app's iCloud Drive container (same identifier as the CloudKit database
        # above) visible in Files/Finder as "JamShack" — this is what lets a soundfont dropped
        # in Files show up in-app without going through any picker, and vice versa (see
        # `SoundFontLocations`/`SoundFontLibrary`). Distinct capability from the CloudKit
        # database sync already declared above: that one syncs the lightweight index (hash,
        # presets, tags...), this one syncs the actual `.sf2` bytes.
        NSUbiquitousContainers:
          iCloud.com.jamshack.JamShackApp:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: JamShack
        # Lets Files/Finder treat the container above as a normal folder the user can drop
        # files into directly, and lets this app declare itself a handler for `.sf2`/`.dls`
        # documents opened from elsewhere (Mail, Safari, "Open in...").
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # Apple declares no public UTI for SoundFont2/DLS files — these two are this app's own,
        # conforming only to `public.data` (a generic binary file), which is all that's needed
        # for `.fileImporter`/drag-and-drop/"Open in..." to recognize them by extension.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jamshack.soundfont2
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - sf2
          - UTTypeIdentifier: com.jamshack.downloadable-sound
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - dls
        CFBundleDocumentTypes:
          - CFBundleTypeName: SoundFont
            LSItemContentTypes:
              - com.jamshack.soundfont2
              - com.jamshack.downloadable-sound
            LSHandlerRank: Owner
        # Supported orientations — previously patched by hand straight into the generated
        # Info.plist (never tracked here), so a `xcodegen generate` would silently drop it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        # Bumped to 1.1 in fbed9f2 by hand-editing the generated .pbxproj (never tracked here),
        # right after LSApplicationCategoryType was added — kept in sync here now so
        # `xcodegen generate` doesn't silently revert it to 1.0.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local code-signing setup, previously configured by hand in Xcode's Signing &
        # Capabilities and committed directly in the .xcodeproj (never tracked in this file
        # until now) — every iCloud/CloudKit-tied entitlement above makes `xcodebuild` demand a
        # real provisioning profile, so an ad-hoc "Sign to Run Locally" build needs a real
        # DEVELOPMENT_TEAM. Tracked here now so a future `xcodegen generate` can't silently drop
        # it again (it's the .xcodeproj's own build settings, not something XcodeGen can infer
        # from anywhere else — regenerating the project without this present wipes it).
        DEVELOPMENT_TEAM: T2L9QQQ4PL
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"
        "CODE_SIGN_STYLE[sdk=macosx*]": Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Developer"
    entitlements:
      path: Generated/JamShackApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        # Under App Sandbox, CoreMIDI access to a REAL hardware keyboard (USB or Bluetooth LE)
        # needs these explicitly — without them, `MIDIGetNumberOfSources()`/`MIDIPortConnectSource`
        # stay silent for physical devices even though the code path is otherwise identical to
        # the computer-keyboard one (confirmed: MIDI sound stopped working entirely, at launch,
        # with no Swift-level regression to explain it — the actual cause was code signing
        # starting to truly enforce the sandbox once a real `DEVELOPMENT_TEAM` got assigned,
        # which these two keys were missing for).
        com.apple.security.device.usb: true
        com.apple.security.device.bluetooth: true
        # Pairs with .fileExporter/.fileImporter (scene save/load, sample-sound folder in
        # SceneManagementView): grants read/write access to whatever the user actually
        # picked via the panel these present — macOS-only concept (no effect on iOS, which
        # has no equivalent entitlement key), but harmless to declare on both since XcodeGen
        # applies the same entitlements dict to the single multiplatform target.
        com.apple.security.files.user-selected.read-write: true
        # LLM connections and every other Settings category sync via CloudKit (see
        # ImprovSession.modelContainer) — both
        # platform bundle IDs (`-macOS`/`-iOS`, distinct on purpose) must point at this SAME
        # explicit container identifier for data to sync between them; Xcode's Signing &
        # Capabilities UI defaults to a per-bundle-ID container unless told otherwise. Like
        # Game Center below, this key alone makes xcodebuild demand a real provisioning
        # profile — local ad-hoc "Sign to Run Locally" builds need a Development Team set
        # (Xcode > Signing & Capabilities, or `DEVELOPMENT_TEAM` in this file) before they
        # build again.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jamshack.JamShackApp
        com.apple.developer.icloud-services:
          - CloudKit
          # Ubiquity-container (iCloud Drive) file sync for soundfont bytes — a distinct
          # capability from the CloudKit database service right above, which only syncs the
          # lightweight index. See `NSUbiquitousContainers` in the Info.plist properties above.
          - CloudDocuments
        # Required for `FileManager.url(forUbiquityContainerIdentifier:)` to resolve the same
        # container declared via `icloud-container-identifiers`/`NSUbiquitousContainers` above —
        # without this key that call returns nil even though the CloudKit database entitlement
        # is present, because ubiquity containers and the CloudKit container identifier list are
        # separate entitlement keys that happen to share the same identifier string by choice.
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jamshack.JamShackApp
        # Push Notifications capability, needed for the silent push declared via
        # `UIBackgroundModes: remote-notification` above. Like the iCloud container entitlement
        # right above it, this alone makes `xcodebuild` demand a real provisioning profile — a
        # local ad-hoc "Sign to Run Locally" build needs a `DEVELOPMENT_TEAM` set first (same
        # standing requirement as the rest of CloudKit sync). `development` here is deliberate,
        # not a placeholder: a real App Store/TestFlight build's own provisioning profile swaps
        # this to `production` automatically at sign time — this file is never touched again
        # for that.
        aps-environment: development
        # Game Center matchmaking (JamSessionView's "Jam Game Center" modes) needs
        # `com.apple.developer.game-center: true` here PLUS the capability enabled for this
        # app's App ID at developer.apple.com. Deliberately NOT added to this file: unlike
        # every entitlement above (compatible with ad-hoc "Sign to Run Locally"), that one key
        # alone made `xcodebuild` demand a real provisioning profile — confirmed by trying it
        # and watching every build fail, not assumed. Add it yourself via Xcode's Signing &
        # Capabilities > "+ Capability" > "Game Center" (this also handles the App ID
        # registration, which needs your own Apple Developer sign-in) once you're ready to
        # test the Game Center modes for real — the code is already there waiting for it.
    dependencies:
      - package: MusicTheoryKit
        product: JamShackUI
      - package: MusicTheoryKit
        product: AppCore
      - package: MusicTheoryKit
        product: Localization
    # Generates a shared scheme per platform (JamShackApp_iOS / JamShackApp_macOS) so
    # `xcodebuild -scheme ...` works without opening Xcode first. Previously only the iOS one
    # existed, hand-committed straight into .xcshareddata (never tracked here) — a
    # `xcodegen generate` would silently delete it since XcodeGen owns the whole .xcodeproj
    # bundle and doesn't know to keep schemes it didn't create.
    scheme: {}
